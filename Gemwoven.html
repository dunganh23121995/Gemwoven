<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172522">
  <title>Gemwoven · Thế giới diệu ngọc</title>
  <link rel="icon" href="assets/gemwoven/items/mana.png">
  <link rel="stylesheet" href="src/gemwoven/ui.css">
  <link rel="stylesheet" href="src/gemwoven/living-scenes.css">
  <link rel="stylesheet" href="src/gemwoven/hero-forms.css">
  <link rel="stylesheet" href="src/gemwoven/progression.css">
  <link rel="stylesheet" href="src/gemwoven/journey.css">
  <link rel="stylesheet" href="src/gemwoven/equipment.css">
</head>
<body>
  <main class="workbench">
    <aside class="review" aria-label="Điều hướng bản ghép">
      <p class="eyebrow">THẾ GIỚI DIỆU NGỌC</p>
      <h1>Gemwoven</h1>
      <nav id="screen-menu" aria-label="Các màn hình"></nav>
      <details>
        <summary>Kiểm tra bản ghép</summary>
        <label><input id="show-bounds" type="checkbox"> Hiện viền vùng bấm</label>
        <label><input id="hide-copy" type="checkbox"> Ẩn toàn bộ chữ</label>
        <label><input id="edit-copy" type="checkbox"> Sửa chữ trực tiếp</label>
        <button id="export-copy" type="button">Xuất nội dung chữ</button>
        <a href="Gemwoven_Assets.html" target="_blank" rel="noopener">Xem từng ảnh thành phần ↗</a>
      </details>
      <p class="review-note">Chọn một màn hoặc dùng thanh điều hướng bên dưới khung hình.</p>
    </aside>
    <div id="viewport">
      <section id="stage" aria-label="Màn hình Gemwoven">
        <div id="scene"></div>
      </section>
    </div>
  </main>
  <dialog id="preview-dialog" class="gw-dialog" aria-labelledby="dialog-title">
    <span class="gw-emblem" aria-hidden="true"></span>
    <header class="gw-head"><h2 id="dialog-title"></h2></header>
    <button type="button" class="close gw-close" id="close-dialog" aria-label="Đóng">×</button>
    <div class="gw-body" id="dialog-body">
      <div id="dialog-art"></div>
      <p id="dialog-copy"></p>
      <div id="dialog-extra"></div>
      <div id="dialog-links"></div>
    </div>
    <footer class="gw-actions"><button type="button" id="return-dialog" class="plain-button gw-btn">Quay lại</button></footer>
  </dialog>
  <script src="src/gemwoven/assets.js"></script>
  <script src="src/gemwoven/screens.js"></script>
  <script src="src/gemwoven/expansion.js"></script>
  <script src="src/gemwoven/copy.js"></script>
  <script src="src/gemwoven/boss-chapters.js"></script>
  <script src="src/gemwoven/boss-tactics.js"></script>
  <script src="src/gemwoven/world.js"></script>
  <script src="src/gemwoven/progression.js"></script>
  <script src="src/gemwoven/progression-ui.js"></script>
  <script src="src/gemwoven/art-screens.js"></script>
  <script src="src/gemwoven/journey-ui.js"></script>
  <script src="src/gemwoven/equipment-ui.js"></script>
  <script src="src/gemwoven/chapter-guide.js"></script>
  <script src="src/gemwoven/form-effects.js"></script>
  <script src="src/gemwoven/hero-forms.js"></script>
  <script src="src/gemwoven/summon-cinematic.js"></script>
  <script src="src/gemwoven/living-hub.js"></script>
  <script src="src/gemwoven/ui.js"></script>
</body>
</html>
