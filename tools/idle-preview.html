<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So sánh dáng nghỉ</title>
<style>
  :root{color-scheme:dark;--bg:#1d2320;--card:#28302b;--ink:#eef1e8;--muted:#a9b3a6;--accent:#e2b85c}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:16px}
  h1{font-size:20px;margin:0 0 4px}p{color:var(--muted);margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border-radius:10px;padding:12px}
  .card h2{font-size:15px;margin:0 0 8px}
  .pair{display:flex;gap:10px}.pair figure{margin:0;flex:1;text-align:center}
  figcaption{font-size:13px;color:var(--muted)}figcaption b{color:var(--accent)}
  .sprite{width:100%;aspect-ratio:1;background-repeat:no-repeat;background-size:200% 400%;background-color:#3a4a3e;border-radius:8px;image-rendering:auto}
  label{display:inline-flex;gap:6px;align-items:center;margin-bottom:12px;color:var(--muted)}
</style>
</head>
<body>
<h1>Dáng nghỉ: vải bay (cũ) và nhún cả người (mới)</h1>
<p>Bản mới giữ nguyên nét vẽ gốc, chỉ dáng người nhún: chân khuỵu nhẹ, thân hạ rồi bật lên, đầu theo sau một nhịp.</p>
<label>Tốc độ (ms/khung) <input id="ms" type="range" min="80" max="300" value="150"> <span id="msv">150</span></label>
<div class="grid" id="grid"></div>
<script>
const items=[
  ['forest-rootknight','Hiệp Sĩ Rễ Cổ (tinh anh)','../assets/gemwoven/elites/forest-rootknight/idle.webp'],
  ['fire','Hỏa Long Tro Tàn (boss)','../assets/gemwoven/boss-anim/fire/idle.webp'],
  ['mire','Mẫu Nấm Độc (boss)','../assets/gemwoven/boss-anim/mire/idle.webp']
];
const grid=document.getElementById('grid'),sprites=[];
for(const [id,name,old] of items){
  const card=document.createElement('section');card.className='card';
  card.innerHTML=`<h2>${name}</h2><div class="pair"><figure><div class="sprite" style="background-image:url('${old}')"></div><figcaption>Cũ · vải bay</figcaption></figure><figure><div class="sprite" style="background-image:url('../.build-cache/bounce/${id}/rig/idle.webp')"></div><figcaption><b>Mới · nhún</b></figcaption></figure></div>`;
  grid.append(card);sprites.push(...card.querySelectorAll('.sprite'));
}
let ms=150,frame=0,last=0;
document.getElementById('ms').oninput=e=>{ms=+e.target.value;document.getElementById('msv').textContent=ms;};
function tick(t){requestAnimationFrame(tick);if(t-last<ms)return;last=t;frame=(frame+1)%8;for(const s of sprites)s.style.backgroundPosition=`${(frame%2)*100}% ${Math.floor(frame/2)/3*100}%`;}
requestAnimationFrame(tick);
</script>
</body>
</html>
