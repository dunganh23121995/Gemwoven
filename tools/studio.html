<!doctype html>
<!-- Gemwoven Studio: the one page for development and review. Each tab opens a tool of the repo:
     the hero studio (every hero, form, combat action, showcase, the hero checklist), a free combat
     sandbox, the hub game itself, the boss/chapter guide and the hero pipeline guide.
     Serve the repository root (python tools/dev_server.py) and open /tools/studio.html.
     To add a tool, add one entry to TOOLS below. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemwoven Studio</title>
<base href="../">
<style>
:root{color-scheme:dark;--bg:#16130f;--panel:#221d17;--line:#3a3127;--ink:#efe4cf;--dim:#b9a98a;--gold:#e8c26a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;color:var(--gold);white-space:nowrap}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:thin}
nav button{flex:none;background:#2f281f;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
nav button.on{background:var(--gold);color:#1a1409;border-color:var(--gold);font-weight:600}
header a{color:var(--dim);font-size:12px;white-space:nowrap}
main{flex:1;min-height:0;position:relative}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.doc{position:absolute;inset:0;overflow:auto;padding:16px 20px 40px;max-width:980px;margin:0 auto}
.doc h1{font-size:22px;color:var(--gold)}.doc h2{font-size:18px;color:var(--gold);margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:4px}.doc h3{font-size:15px}
.doc table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px}.doc th,.doc td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}.doc th{background:#2f281f}
.doc code{background:#2a241d;padding:1px 5px;border-radius:4px;font-size:12.5px}.doc pre{background:#2a241d;padding:10px;border-radius:8px;overflow:auto}.doc pre code{background:none;padding:0}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}.doc a{color:var(--gold)}
@media (max-width:760px){header{flex-wrap:wrap;padding:6px 8px}header h1{width:100%;font-size:15px}nav button{padding:8px 10px}}
</style>
</head>
<body>
<header>
  <h1>Gemwoven Studio</h1>
  <nav id="nav"></nav>
  <a id="open" target="_blank" rel="noopener">Mở riêng ↗</a>
</header>
<main id="main"></main>
<script>
// One entry per tool: tab label, page (repo-relative) or a markdown doc rendered here.
const TOOLS=[
  {id:'heroes',label:'Tướng',src:'tools/hero-gallery.html',param:'hero'},
  {id:'combat',label:'Trận đấu (QA)',src:'Game.html?qa'},
  {id:'hub',label:'Game (Hub)',src:'Gemwoven.html'},
  {id:'summon-test',label:'Triệu hồi (test)',src:'Gemwoven.html?summonTest=1'},
  {id:'bosses',label:'Boss & chương',src:'docs/BOSS_CHAPTERS.html'},
  {id:'pipeline',label:'Quy trình làm tướng',doc:'docs/HERO_PIPELINE.md'}
];
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
// Tiny markdown renderer for the docs tabs (headings, tables, lists, code, bold, links).
function md(text){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  const lines=text.split('\n'),out=[];let i=0;
  while(i<lines.length){
    const l=lines[i];
    if(/^```/.test(l)){const code=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))code.push(lines[i++]);i++;out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue;}
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      out.push('<table><tr>'+cells(rows[0]).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</table>');continue;}
    const h=l.match(/^(#{1,3}) (.*)/);if(h){out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue;}
    if(/^---+$/.test(l)){out.push('<hr>');i++;continue;}
    if(/^\s*([-*]|\d+\.) /.test(l)){const ordered=/^\s*\d+\./.test(l),items=[];while(i<lines.length&&/^\s*([-*]|\d+\.) |^\s{2,}\S/.test(lines[i])){if(/^\s*([-*]|\d+\.) /.test(lines[i]))items.push(lines[i].replace(/^\s*([-*]|\d+\.) /,''));else items[items.length-1]+=' '+lines[i].trim();i++;}
      out.push(`<${ordered?'ol':'ul'}>`+items.map(t=>'<li>'+inline(t)+'</li>').join('')+`</${ordered?'ol':'ul'}>`);continue;}
    if(l.trim()){const para=[];while(i<lines.length&&lines[i].trim()&&!/^(#|\||```|---|\s*([-*]|\d+\.) )/.test(lines[i]))para.push(lines[i++]);out.push('<p>'+inline(para.join(' '))+'</p>');continue;}
    i++;
  }
  return out.join('\n');
}
async function show(id){
  const tool=TOOLS.find(t=>t.id===id)||TOOLS[0];
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===tool.id));
  const url=new URL(location);url.searchParams.set('tab',tool.id);history.replaceState(null,'',url);
  const main=$('main');main.replaceChildren();
  if(tool.doc){
    const div=document.createElement('div');div.className='doc';div.textContent='Đang tải…';main.append(div);
    try{div.innerHTML=md(await (await fetch(tool.doc,{cache:'no-store'})).text());}catch(e){div.textContent='Không tải được '+tool.doc;}
    $('open').href=tool.doc;return;
  }
  let src=tool.src;if(tool.param&&params.get(tool.param))src+=(src.includes('?')?'&':'?')+tool.param+'='+encodeURIComponent(params.get(tool.param));
  const frame=document.createElement('iframe');frame.src=src;frame.title=tool.label;main.append(frame);$('open').href=src;
}
$('nav').replaceChildren(...TOOLS.map(t=>{const b=document.createElement('button');b.textContent=t.label;b.dataset.id=t.id;b.onclick=()=>show(t.id);return b;}));
show(params.get('tab')||'heroes');
</script>
</body>
</html>
