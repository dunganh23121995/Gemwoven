<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noct Showcase</title>
<base href="../">
<link rel="stylesheet" href="src/gemwoven/hero-forms.css">
<style>
  :root{color-scheme:dark;--bg:#16201d;--card:#232d29;--ink:#eef1e8;--muted:#a9b3a6;--accent:#e2b85c}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:16px}
  h1{font-size:20px;margin:0 0 4px}p{color:var(--muted);margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border-radius:10px;padding:12px}
  .card h2{font-size:16px;margin:0 0 8px}
  .stage{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:linear-gradient(#5f7d8f,#9fb59b 70%,#6d7d5e 70%)}
  .hero{position:absolute;inset:6% 10% 4%}
  .hero>img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  button{background:#3b4a40;color:var(--ink);border:1px solid #56685b;border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#4a5d50}
</style>
</head>
<body>
<h1>Noct · trạng thái trình diễn và triệu hồi</h1>
<p>Ba dạng của Noct đứng cạnh nhau. Mỗi dạng tự làm động tác của mình sau vài giây; bấm nút để xem ngay cảnh triệu hồi hoặc từng động tác.</p>
<div class="grid" id="grid"></div>
<script src="src/gemwoven/motion-setting.js"></script>
<script src="src/gemwoven/assets.js"></script>
<script src="src/gemwoven/form-effects.js"></script>
<script src="src/gemwoven/hero-show.js"></script>
<script>
const A=window.GEMWOVEN_ASSETS;
const forms=[[1,'Dạng 1 · Ảnh Kiếm Sĩ'],[2,'Dạng 2 · Dạ Ảnh'],[3,'Dạng 3 · Tử Thần']];
const labels={1:['Xoay kiếm','Mắt lóe sáng'],2:['Ánh trăng dọc lưỡi kiếm','Mắt lóe, khói đen cuộn'],3:['Xoay lưỡi hái','Lửa đen trong lòng bàn tay']};
for(const [form,name] of forms){
  const show=A[`show-shadow-${form}`];if(!show)continue;
  const card=document.createElement('section');card.className='card';
  card.innerHTML=`<h2>${name}</h2><div class="stage"><div class="hero"></div></div><div class="row"></div>`;
  document.getElementById('grid').append(card);
  const host=card.querySelector('.hero'),row=card.querySelector('.row');
  let current=null;
  function mount(){
    current?.stop();host.innerHTML='';
    const img=document.createElement('img');img.className='art';img.src=new URL(show.file,document.baseURI).href;
    img.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%';host.append(img);
    if(form===3&&window.GemwovenFormEffects){const fx=document.createElement('span');fx.className='hero-form-effects';fx.setAttribute('aria-hidden','true');fx.innerHTML=GemwovenFormEffects.markup('shadow',3,A['form-aura-shadow']);host.append(fx);}
    current=GemwovenHeroShow.attach(host,'shadow',form);
  }
  mount();
  const summon=document.createElement('button');summon.textContent='Triệu hồi';summon.onclick=()=>{mount();current.summon();};row.append(summon);
  labels[form].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>current.act(i);row.append(b);});
  setTimeout(()=>current.summon(),300+form*400);
}
</script>
</body>
</html>
