<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noct Studio</title>
<!-- Local workbench for finishing Noct: drives Game.html?qa in a frame and inspects his sheets.
     Serve the repository root (python -m http.server 8080) and open /tools/noct-studio.html. -->
<style>
:root{color-scheme:dark;--bg:#16130f;--panel:#221d17;--line:#3a3127;--ink:#efe4cf;--dim:#b9a98a;--gold:#e8c26a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif;display:flex;gap:16px;padding:16px;min-height:100vh}
.game{flex:none;width:390px;height:844px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000}
.game iframe{width:390px;height:844px;border:0;display:block}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:0 0 8px;color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:#2f281f;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--gold)}button.on{background:var(--gold);color:#1a1409;border-color:var(--gold);font-weight:600}
label{display:inline-flex;gap:6px;align-items:center;color:var(--dim)}
.status{color:var(--dim);font-size:13px}
.viewer{display:flex;gap:12px;flex-wrap:wrap}
canvas.play{width:256px;height:256px;border-radius:8px;background:repeating-conic-gradient(#2a241d 0 25%,#221d17 0 50%) 0 0/16px 16px}
.sheet{position:relative;max-width:100%;overflow:auto;border-radius:8px;background:repeating-conic-gradient(#2a241d 0 25%,#221d17 0 50%) 0 0/16px 16px}
.sheet img{display:block;max-width:none;image-rendering:auto}
.sheet .cell{position:absolute;border:1px solid #e8c26a55;color:#e8c26a;font:11px monospace;padding:1px 3px;cursor:pointer}
.sheet .cell.cur{border-color:var(--gold);background:#e8c26a22}
.meta{font:12px monospace;color:var(--dim)}
</style>
</head>
<body>
<div class="game"><iframe id="game" src="../Game.html?qa" title="Game"></iframe></div>
<div class="side">
  <div class="row"><h1>Noct Studio</h1><span class="status" id="status">Đang tải game…</span><button id="reload" title="Tải lại sau khi build lại Game.html">Tải lại game</button></div>
  <section>
    <h2>Hình thái</h2>
    <div class="row" id="forms"><button data-form="1">1 · Ảnh Kiếm Sĩ</button><button data-form="2">2 · Dạ Ảnh</button><button data-form="3" class="on">3 · Tử Thần</button></div>
  </section>
  <section>
    <h2>Trong trận</h2>
    <div class="row">
      <button data-do="idle">Nghỉ</button>
      <button data-do="attack">Đánh thường</button>
      <button data-do="ultimate">Tuyệt kỹ</button>
      <button data-do="depart">Bay rời màn</button>
      <button data-do="hit">Bị đánh (thử hoá mờ)</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label>Đối thủ <select id="enemy"></select></label>
      <label><input type="checkbox" id="fx" checked> Hiệu ứng</label>
      <label><input type="checkbox" id="armor"> Địch có 500 giáp</label>
    </div>
  </section>
  <section>
    <h2>Sprite sheet</h2>
    <div class="row" id="actions"></div>
    <div class="row" style="margin:8px 0">
      <button id="playpause">Tạm dừng</button><button id="prev">◀ Khung trước</button><button id="next">Khung sau ▶</button>
      <label>ms/khung <input type="range" id="ms" min="40" max="600" value="150"><span id="msv">150</span></label>
      <label><input type="checkbox" id="blend" checked> Hoà khung</label>
      <label><input type="checkbox" id="onion"> Bóng khung trước</label>
    </div>
    <div class="viewer"><canvas class="play" id="play" width="512" height="512"></canvas><div><div class="meta" id="meta"></div><div class="sheet" id="sheet"></div></div></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id),frame=$('game');
let form=3,game=null,sheets={},action='idle',img=null,cur=0,playing=true,last=0,acc=0;
const win=()=>frame.contentWindow,gq=()=>win()?.gameQA;
const say=t=>$('status').textContent=t;
// Common foes are the campaign creatures, wired the way a campaign battle wires them.
let originalMob=null;
function enemy(){
  const id=$('enemy').value,art=gq().art;
  originalMob??={art:art.enemies.fire,name:gq().monsters.fire.name,bosses:{...art.bosses}};
  if(id.startsWith('boss:')){
    // Like a campaign boss stage: the chapter's element key, its world-boss sheet when it has one.
    const [,chapter]=id.split(':'),ch=gq().chapters.find(c=>c.id===chapter),key=ch.element,world=art.worldBosses?.[ch.boss];
    art.bosses[key]=world||originalMob.bosses[key];gq().monsters[key].boss=gq().bossDefs[ch.boss]?.name||ch.boss;
    return {stage:5,enemyKey:key,qaElite:false,qaBossArt:world?ch.boss:'base'};
  }
  art.enemies.fire=originalMob.art;
  const [tier,key]=id.split(':'),c=art.campaignCreatures[key],label=$('enemy').selectedOptions[0].textContent.split(' · ').pop();art.enemies.fire=c.idle?{idle:c.idle,attack:c.still,cast:c.still,hurt:c.still}:{idle:c,attack:c,cast:c,hurt:c};gq().monsters.fire.name=label;
  return {stage:4,enemyKey:'fire',qaElite:tier==='elite',qaBossArt:''};
}
// Grouped as the campaign uses them: each chapter's ordinary creatures and its larger elites.
function fillEnemies(){
  if($('enemy').options.length)return;
  const art=gq().art.campaignCreatures,groups={normal:'Quái thường',elite:'Quái tinh anh'};
  const bosses=document.createElement('optgroup');bosses.label='Boss (màn 50 của mỗi chương)';
  for(const ch of gq().chapters){const o=document.createElement('option');o.value='boss:'+ch.id;o.textContent=`Boss · Ch.${ch.index} ${ch.name} · ${gq().bossDefs[ch.boss]?.name||ch.boss}${gq().art.worldBosses?.[ch.boss]?'':' (dùng hình boss hệ chung)'}`;bosses.append(o);}
  $('enemy').append(bosses);
  for(const [tier,label] of Object.entries(groups)){
    const g=document.createElement('optgroup');g.label=label;
    for(const ch of gq().chapters){
      const list=tier==='elite'?(ch.elites||[]):(ch.ordinary||ch.creatures||[]);
      for(const entry of list){const key=Array.isArray(entry)?entry[0]:entry;if(!art[key])continue;
        const o=document.createElement('option');o.value=tier+':'+key;o.textContent=`${label} · ${ch.name||ch.id} · ${Array.isArray(entry)?entry[1]:gq().creatureNames?.[ch.id]?.[key]||key}`;g.append(o);}
    }
    $('enemy').append(g);
  }
}
function configure(){
  gq().configure({key:'shadow',form,hp:10000,enemyHp:10000,enemyMax:10000,armor:0,enemyArmor:$('armor').checked?500:0,energy:0,enemyEnergy:0,...enemy()});
  gq().setReduced(!$('fx').checked);loadSheets();
}
async function boot(){
  say('Đang tải game…');
  const d=frame.contentDocument;
  await new Promise(r=>{const t=setInterval(()=>{if(d.querySelector('[data-class="shadow"]')){clearInterval(t);r();}},150);});
  d.querySelector('[data-class="shadow"]').click();
  const list=d.getElementById('heroList');if(list&&list.offsetParent)d.querySelector('.gem-choice.chosen')?.click();
  d.getElementById('startBtn').click();
  await new Promise(r=>setTimeout(r,300));fillEnemies();configure();say('Sẵn sàng');
}
frame.addEventListener('load',()=>boot().catch(e=>say('Lỗi: '+e.message)));
$('reload').onclick=()=>{originalMob=null;frame.src='../Game.html?qa&t='+Date.now();};
$('forms').onclick=e=>{const b=e.target.closest('button');if(!b)return;form=+b.dataset.form;for(const x of $('forms').children)x.classList.toggle('on',x===b);configure();};
for(const id of ['enemy','fx','armor'])$(id).onchange=configure;
document.querySelectorAll('[data-do]').forEach(b=>b.onclick=async()=>{
  const q=gq();if(!q)return;say('Đang chạy: '+b.textContent);
  try{
    if(b.dataset.do!=='hit')configure();
    if(b.dataset.do==='attack')await q.attack('hero',100,{attackChain:1});
    if(b.dataset.do==='ultimate')await q.heroUltimate();
    if(b.dataset.do==='depart')await q.departVictoriousHero();
    if(b.dataset.do==='hit'){const hp=q.state.hp;await q.attack('enemy',100);say(`Bị đánh: mất ${hp-q.state.hp} HP`);return;}
    say('Xong: '+b.textContent);
  }catch(e){say('Lỗi: '+e.message);}
});
function loadSheets(){
  const art=gq().art;
  sheets=form===1?art.heroes.shadow:art.heroForms.shadow[String(form)];
  $('actions').replaceChildren(...Object.keys(sheets).filter(k=>!['buff'].includes(k)).map(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===action?'on':'';b.onclick=()=>pick(k);return b;}));
  pick(sheets[action]?action:'idle');
}
function pick(name){
  action=name;for(const b of $('actions').children)b.classList.toggle('on',b.textContent===name);
  const s=sheets[name];img=new Image();img.onload=drawSheet;img.src=s.src;cur=0;
  if(s.frameDuration){$('ms').value=s.frameDuration;$('msv').textContent=s.frameDuration;}
}
function drawSheet(){
  const s=sheets[action],box=$('sheet'),scale=Math.min(1,560/img.naturalWidth);
  box.replaceChildren();const im=img.cloneNode();im.style.width=img.naturalWidth*scale+'px';box.append(im);
  const cw=img.naturalWidth/s.cols*scale,ch=img.naturalHeight/s.rows*scale;
  for(let i=0;i<s.count;i++){const c=document.createElement('div');c.className='cell';c.textContent=i;Object.assign(c.style,{left:(i%s.cols)*cw+'px',top:Math.floor(i/s.cols)*ch+'px',width:cw+'px',height:ch+'px'});c.onclick=()=>{cur=i;playing=false;$('playpause').textContent='Phát';};box.append(c);}
  $('meta').textContent=`${action}: ${s.count} khung · lưới ${s.cols}×${s.rows} · ${img.naturalWidth}×${img.naturalHeight}px${s.frameDuration?` · ${s.frameDuration} ms/khung trong game`:''}`;
}
function cell(i){const s=sheets[action],w=img.naturalWidth/s.cols,h=img.naturalHeight/s.rows;return [(i%s.cols)*w,Math.floor(i/s.cols)*h,w,h];}
function render(now){
  requestAnimationFrame(render);const s=sheets[action];if(!img?.complete||!s)return;
  const ms=+$('ms').value;if(playing){acc+=now-(last||now);while(acc>=ms){acc-=ms;cur=(cur+1)%s.count;}}last=now;
  const g=$('play').getContext('2d'),k=playing&&$('blend').checked?acc/ms:0,m=k*k*(3-2*k);
  g.clearRect(0,0,512,512);
  if($('onion').checked){g.globalAlpha=.3;g.drawImage(img,...cell((cur+s.count-1)%s.count),0,0,512,512);}
  g.globalAlpha=1;g.drawImage(img,...cell(cur),0,0,512,512);
  if(m>0){g.globalAlpha=m;g.drawImage(img,...cell((cur+1)%s.count),0,0,512,512);}
  g.globalAlpha=1;
  for(const c of $('sheet').querySelectorAll('.cell'))c.classList.toggle('cur',+c.textContent===cur);
}
requestAnimationFrame(render);
$('ms').oninput=()=>$('msv').textContent=$('ms').value;
$('playpause').onclick=()=>{playing=!playing;$('playpause').textContent=playing?'Tạm dừng':'Phát';};
$('prev').onclick=()=>{playing=false;$('playpause').textContent='Phát';cur=(cur+sheets[action].count-1)%sheets[action].count;};
$('next').onclick=()=>{playing=false;$('playpause').textContent='Phát';cur=(cur+1)%sheets[action].count;};
</script>
</body>
</html>
