<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemwoven · Thư viện hình thành phần</title><link rel="stylesheet" href="src/gemwoven/ui.css"></head>
<body><main class="asset-page"><a href="Gemwoven.html">← Mở bản ghép 6 màn</a><h1>Thư viện hình thành phần</h1><p>6 background riêng và các item PNG nền trong suốt. Mọi nhãn, tiêu đề và số liệu được đặt bằng chữ HTML ở bản ghép.</p><h2>Background</h2><div id="backgrounds" class="background-grid"></div><h2 id="asset-count">Item độc lập</h2><div id="assets" class="asset-grid"></div></main><script src="src/gemwoven/assets.js"></script><script>
const names={arena:'Đấu trường',summon:'Triệu hồi',shop:'Cửa hàng',forge:'Rèn đồ',upgrade:'Nâng cấp',tavern:'Quán bia'};
for(const [key,title] of Object.entries(names)){const f=document.createElement('figure'),a=document.createElement('a'),im=document.createElement('img'),c=document.createElement('figcaption');a.href=`assets/gemwoven/backgrounds/${key}.png`;im.src=`assets/gemwoven/backgrounds/${key}.webp`;im.alt=title;a.append(im);c.textContent=title;f.append(a,c);document.getElementById('backgrounds').append(f);}
document.getElementById('asset-count').textContent=`${Object.keys(GEMWOVEN_ASSETS).length} item độc lập`;
for(const [key,asset] of Object.entries(GEMWOVEN_ASSETS)){const f=document.createElement('figure');f.className='asset-card';const wrap=document.createElement('div');wrap.className='checker';const im=document.createElement('img');im.src=asset.file;im.alt=key;im.loading='lazy';wrap.append(im);const cap=document.createElement('figcaption');cap.textContent=key;const s=document.createElement('small');s.textContent=`${asset.width} × ${asset.height} · PNG / alpha`;const a=document.createElement('a');a.href=asset.file;a.download=key+'.png';a.textContent='Tải ảnh PNG';f.append(wrap,cap,s,a);document.getElementById('assets').append(f);}
</script></body></html>
